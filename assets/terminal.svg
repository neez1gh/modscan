<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .title-bar { fill: #313244; }
      .title-text { fill: #cdd6f4; font-family: monospace; font-size: 13px; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
      .output { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 14px; }
      .green { fill: #a6e3a1; }
      .yellow { fill: #f9e2af; }
      .red { fill: #f38ba8; }
      .white { fill: #cdd6f4; }
      .dim { fill: #6c7086; }
      .arrow { fill: #89b4fa; font-weight: bold; }
      .header { fill: #cba6f7; font-weight: bold; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="400" rx="10"/>
  <rect class="title-bar" x="0" y="0" width="800" height="36" rx="10"/>
  <rect class="title-bar" x="0" y="20" width="800" height="16"/>
  <circle class="dot-red" cx="14" cy="18" r="6"/>
  <circle class="dot-yellow" cx="30" cy="18" r="6"/>
  <circle class="dot-green" cx="46" cy="18" r="6"/>
  <text class="title-text" x="400" y="24" text-anchor="middle">modscan — ~/github/modscan</text>

  <text class="output header" x="20" y="65">  📦 Scanning 23 dependencies...</text>

  <text class="output green bold" x="20" y="95">  ✓</text>
  <text class="output dim" x="40" y="95">github.com/gin-gonic/gin</text>
  <text class="output dim" x="400" y="95">v1.9.1</text>

  <text class="output yellow bold" x="20" y="125">  ⚠</text>
  <text class="output white" x="40" y="125">github.com/sirupsen/logrus</text>
  <text class="output white" x="400" y="125">v1.9.3</text>
  <text class="output dim" x="40" y="145">Low activity, no major updates since 2021</text>
  <text class="output arrow" x="40" y="165">  →</text>
  <text class="output white bold" x="60" y="165">go.uber.org/zap</text>
  <text class="output dim" x="250" y="165">— 10x faster, battle-tested at scale</text>

  <text class="output red bold" x="20" y="195">  ✗</text>
  <text class="output white" x="40" y="195">github.com/dgrijalva/jwt-go</text>
  <text class="output white" x="400" y="195">v3.2.0</text>
  <text class="output red" x="40" y="215">Deprecated — official successor available</text>
  <text class="output arrow" x="40" y="235">  →</text>
  <text class="output white bold" x="60" y="235">github.com/golang-jwt/jwt/v5</text>
  <text class="output dim" x="310" y="235">— Official community successor</text>

  <text class="output green bold" x="20" y="265">  ✓</text>
  <text class="output dim" x="40" y="265">github.com/rs/zerolog</text>
  <text class="output dim" x="400" y="265">v1.33.0</text>

  <text class="output green bold" x="20" y="295">  ✓</text>
  <text class="output dim" x="40" y="295">github.com/spf13/cobra</text>
  <text class="output dim" x="400" y="295">v1.10.2</text>

  <text class="output header" x="20" y="335">  📊 Summary:</text>
  <text class="output green bold" x="20" y="360">    ✓ 20 healthy</text>
  <text class="output yellow bold" x="200" y="360">  ⚠ 2 warnings</text>
  <text class="output red bold" x="400" y="360">  ✗ 1 critical</text>

  <rect x="530" y="347" width="8" height="16" fill="#cdd6f4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
